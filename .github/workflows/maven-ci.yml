name: Java CI with Maven

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Step 1 - Build with test
      run: mvn -B clean verify --file pom.xml

    - name: Step 2 - Verify JaCoCo coverage reports
      run: |
        test -f user-module/target/site/jacoco/jacoco.xml
        test -f account-module/target/site/jacoco/jacoco.xml
        echo "JaCoCo reports ready for user-module and account-module"

    - name: Step 3 - Update PR coverage comment
      if: github.event_name == 'pull_request'
      uses: madrapps/jacoco-report@v1.6.1
      with:
        paths: |
          ${{ github.workspace }}/user-module/target/site/jacoco/jacoco.xml
          ${{ github.workspace }}/account-module/target/site/jacoco/jacoco.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        pr-number: ${{ github.event.pull_request.number }}
        title: Code Coverage Report
        update-comment: true
        comment-type: both
        min-coverage-overall: 50
        min-coverage-changed-files: 0
        debug-mode: true

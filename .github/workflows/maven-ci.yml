name: Java CI with Maven

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Step 1 - Build with test
      run: mvn -B clean verify --file pom.xml

    - name: Step 2 - Verify JaCoCo coverage reports
      run: |
        test -f user-module/target/site/jacoco/jacoco.xml
        test -f account-module/target/site/jacoco/jacoco.xml
        echo "JaCoCo reports ready for user-module and account-module"

    - name: Step 3 - Publish module coverage comment on PR
      if: github.event_name == 'pull_request'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        MIN_COVERAGE: "50"
      run: python3 .github/scripts/publish-coverage-comment.py
